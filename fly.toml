app = "firex-safety-management"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 5000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[mounts]]
  source = "firex_data"
  destination = "/app/server/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
